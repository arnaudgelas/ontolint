name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Lint, Audit & Test
    uses: ./.github/workflows/ci.yml

  codeql:
    name: Require a green CodeQL scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: read
    steps:
      # CodeQL (default setup) scans pushes to main, so a tag on an unscanned commit never
      # releases. A scan that is missing or did not succeed blocks the release; it is not a pass.
      - name: Wait for CodeQL on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          query='[.check_runs[] | select(.name | startswith("Analyze ("))]'
          for attempt in $(seq 1 50); do
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" --jq "$query")
            total=$(jq length <<<"$runs")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            failed=$(jq -r '.[] | select(.status == "completed" and .conclusion != "success") | .name' <<<"$runs")
            if [ -n "$failed" ]; then
              echo "::error::CodeQL did not succeed on $SHA: $failed"
              exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              jq -r '.[] | "\(.name): \(.conclusion)"' <<<"$runs"
              exit 0
            fi
            echo "Waiting for CodeQL ($total runs, $pending pending), attempt $attempt"
            sleep 30
          done
          echo "::error::no completed CodeQL scan on $SHA; release it from a commit pushed to main"
          exit 1

  build:
    name: Build distributions
    needs: [test, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the package version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Build
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/ontolint/
    permissions:
      id-token: write # Mandatory for PyPI Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  verify:
    name: Install the published release
    needs: pypi-publish
    runs-on: ubuntu-latest
    # Each wait on PyPI below may take up to 10 minutes (20 attempts, 30 s apart).
    timeout-minutes: 45
    steps:
      # Install from PyPI, not from the build artifact, and lint a real file, so a broken upload,
      # bad metadata or a wheel without its packaged catalogue fails the release run.
      - name: Install ontolint from PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 -m venv "$RUNNER_TEMP/venv"
          for attempt in $(seq 1 20); do
            if "$RUNNER_TEMP/venv/bin/pip" install --no-cache-dir --quiet "ontolint==$version"; then
              exit 0
            fi
            echo "ontolint $version is not installable yet, attempt $attempt"
            sleep 30
          done
          echo "::error::ontolint $version could not be installed from PyPI"
          exit 1

      - name: Run the installed release
        run: |
          cd "$RUNNER_TEMP"
          version="${GITHUB_REF_NAME#v}"
          installed=$(venv/bin/ontolint --version)
          if [ "$installed" != "ontolint $version" ]; then
            echo "::error::installed '$installed', expected 'ontolint $version'"
            exit 1
          fi
          printf '%s\n' '<https://example.test/C> a <http://www.w3.org/2002/07/owl#Class> .' > smoke.ttl
          venv/bin/ontolint smoke.ttl --format json --fail-on never > report.json
          python3 -c "import json; n = len(json.load(open('report.json'))['findings']); assert n > 0, 'no findings'; print(n, 'findings')"
          venv/bin/ontolint --list-rules --format json | python3 -c "import json, sys; assert len(json.load(sys.stdin)['rules']) > 200"

      # Trusted Publishing attaches a PEP 740 attestation to every upload. Check that PyPI holds
      # exactly the files this run built, and that each one's attestation names this repository and
      # signs those very bytes, so a file swapped or added after the build fails the release run.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # PyPI's JSON and provenance APIs lag the upload, as the simple index does for the install
      # above: a version they do not list yet is retried, and only a file list that still differs
      # from the build, or an attestation that still fails, after the last attempt fails the run.
      - name: Verify the PyPI attestations
        run: |
          version="${GITHUB_REF_NAME#v}"
          built=$(for file in dist/*; do basename "$file"; done | sort)
          published=""
          for attempt in $(seq 1 20); do
            if json=$(curl -sSf "https://pypi.org/pypi/ontolint/$version/json"); then
              published=$(python3 -c "import json, sys; print('\n'.join(sorted(u['filename'] for u in json.load(sys.stdin)['urls'])))" <<<"$json")
              if [ "$built" = "$published" ]; then
                break
              fi
            fi
            echo "PyPI does not list the built files for $version yet, attempt $attempt"
            sleep 30
          done
          if [ "$built" != "$published" ]; then
            echo "::error::PyPI files for $version differ from the build: built [$built], published [$published]"
            exit 1
          fi
          for file in dist/*; do
            for attempt in $(seq 1 20); do
              if uv run --frozen --only-group release pypi-attestations verify pypi \
                --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$file"; then
                continue 2
              fi
              echo "the attestation of $(basename "$file") does not verify yet, attempt $attempt"
              sleep 30
            done
            echo "::error::the PyPI attestation of $(basename "$file") does not verify"
            exit 1
          done
