name: Fuzz

# Mutation-based fuzzing of the input-facing surface (loader, lint rules, CLI, policy parsing).
# The fixed-seed smoke run and the replay of tests/fuzz/regressions live in the normal test suite; this
# workflow gives each target a longer budget with a fresh seed.  Reproduce a failure locally with
#   uv run python -m tests.fuzz.fuzzer --replay <downloaded>/<target>__<ext>__<opt>__<sig>.bin
# and, once the bug is fixed, move the minimised file to tests/fuzz/regressions/.
on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Time budget per target, in seconds"
        type: string
        default: "600"
      seed:
        description: "Fuzzer seed (empty: the run number)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.7"

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [loader, lint, cli, config]
    env:
      FUZZ_SECONDS: ${{ inputs.seconds || '600' }}
      FUZZ_SEED: ${{ inputs.seed || github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Fuzz ${{ matrix.target }}
        run: >
          uv run python -m tests.fuzz.fuzzer
          --target "${{ matrix.target }}"
          --seconds "$FUZZ_SECONDS"
          --seed "$FUZZ_SEED"
          --memory-mb 4096
          --case-seconds 20
          --out fuzz-out

      - name: Upload crashers
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}-seed-${{ env.FUZZ_SEED }}
          path: fuzz-out/
          retention-days: 30
          if-no-files-found: ignore
