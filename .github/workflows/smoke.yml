name: Cross-platform smoke

# A small suite (tests marked `smoke`: parsing, the spawn worker, the command line, the built wheel) on the two
# systems the full gate does not run on.  The full gate stays on Linux in ci.yml; this workflow does not repeat it.
# Run the same thing locally with `uv run python scripts/gate.py --smoke`.
#
# The push trigger on `ci/**` branches lets a branch that changes this suite or the workflow be observed before a
# pull request exists; it never fires on main (ci.yml owns that) and can be dropped once nobody needs it.
on:
  pull_request:
    branches: [main]
  push:
    branches: ["ci/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.7"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run the smoke tests
        run: uv run python scripts/gate.py --smoke
